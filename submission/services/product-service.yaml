# ClusterIP Service: gives the product-service pods one stable name and IP inside the cluster
# Other pods reach it at http://product-service:3001 (DNS: product-service.default.svc.cluster.local)
apiVersion: v1
kind: Service
metadata:
  name: product-service                 # this name becomes the DNS name
  labels:
    app: product-service
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: product-service                # send traffic to pods with this label (from the Deployment)
  ports:
    - name: http
      protocol: TCP
      port: 3001             # port clients call on the Service
      targetPort: http       # named containerPort (3001) in the pod
