# Deployment for the Product Service (Express app listening on port 3001)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
    tier: backend
spec:
  # Stateless service (returns a fixed product list), 1 replica is enough for local Minikube
  replicas: 1
  selector:
    matchLabels:
      app: product-service          # must match template.metadata.labels below
  template:
    metadata:
      labels:
        app: product-service
        tier: backend
    spec:
      containers:
        - name: product-service
          image: product-service:1.0     # loaded into Minikube with "minikube image load"
          imagePullPolicy: Never      # use only the locally loaded image, never pull from a registry
          ports:
            - name: http
              containerPort: 3001     # app.js: const port = 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: SERVICE_NAME
              value: "product-service"
          resources:
            requests:                 # guaranteed minimum, used by the scheduler
              cpu: "50m"
              memory: "64Mi"
            limits:                   # hard maximum
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:             # "can this pod receive traffic?"
            httpGet:
              path: /health           # app.js: app.get('/health', ...)
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:              # "is this pod still alive? if not, restart it"
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
